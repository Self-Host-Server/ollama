services:
  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - /mnt/nas-models/ollama:/root/.ollama
    networks:
      - ollama-net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    networks:
      - ollama-net
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  ollama-net:
    driver: bridge

volumes:
  open-webui:
    driver: local
